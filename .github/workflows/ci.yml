name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: gofmt+vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: files=$(gofmt -l .); if [ -n "$files" ]; then echo "gofmt needed:"; echo "$files"; exit 1; fi
      - name: vet
        run: go vet ./...

  test:
    name: build+test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build all
        run: go build ./...
      - name: test
        run: go test ./...